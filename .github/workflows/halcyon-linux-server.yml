name: Halcyon native Linux server

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-server:
    runs-on: ubuntu-22.04
    if: "!contains(github.event.head_commit.message, 'ci skip')"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.0.9'

      - name: Cache xmake dependencies
        uses: actions/cache@v4
        with:
          path: ~/.xmake/packages
          key: ${{ runner.os }}-xmake-${{ hashFiles('**/xmake.lua') }}

      - name: Update xmake repositories
        run: xmake repo --update

      - name: Configure
        continue-on-error: true
        run: timeout 15m xmake config --arch=x64 --mode=release --yes -vD

      - name: Build native server
        run: xmake -y SkyrimServerRunner

      - name: Build tests
        run: xmake -y TPTests

      # xmake names the output directory after the canonical arch (x86_64), not
      # the --arch=x64 alias passed to config, so locate the binaries instead of
      # hardcoding build/linux/x64/release.
      - name: Locate build output
        run: |
          test_binary="$(find build/linux -type f -name TPTests | head -n 1)"
          if [ ! -x "$test_binary" ]; then
            echo "Could not locate the TPTests binary under build/linux:"
            find build/linux -maxdepth 3
            exit 1
          fi
          echo "HALCYON_BUILD_DIR=$(dirname "$test_binary")" >> "$GITHUB_ENV"

      - name: Run tests
        run: "${{ env.HALCYON_BUILD_DIR }}/TPTests"

      # SkyrimTogetherServer is a thin runner linked against libSTServer.so,
      # which holds the actual server. Its RUNPATH is $ORIGIN, so the shared
      # object has to sit next to the executable or it fails to start with
      # "cannot open shared object file".
      - name: Stage server artifact
        run: |
          mkdir -p halcyon-linux-server
          cp "${{ env.HALCYON_BUILD_DIR }}/SkyrimTogetherServer" halcyon-linux-server/

          shared_objects="$(find "${{ env.HALCYON_BUILD_DIR }}" -maxdepth 1 -type f -name '*.so')"
          if [ -z "$shared_objects" ]; then
            echo "No shared objects found next to the server binary:"
            find "${{ env.HALCYON_BUILD_DIR }}" -maxdepth 1
            exit 1
          fi
          echo "$shared_objects" | xargs -I {} cp {} halcyon-linux-server/

          cp -r config halcyon-linux-server/ 2>/dev/null || true
          cp LICENSE halcyon-linux-server/

      # Fails the build if the packaged server cannot resolve its libraries,
      # which is invisible until someone runs the artifact.
      - name: Verify artifact links
        run: |
          missing="$(cd halcyon-linux-server && ldd ./SkyrimTogetherServer | grep 'not found' || true)"
          if [ -n "$missing" ]; then
            echo "Packaged server has unresolved libraries:"
            echo "$missing"
            exit 1
          fi
          echo "All libraries resolve:"
          cd halcyon-linux-server && ldd ./SkyrimTogetherServer

      - name: Upload native server
        uses: actions/upload-artifact@v4
        with:
          name: Halcyon Linux Server (${{ github.sha }})
          path: halcyon-linux-server/
