name: Linux-port playable build

# Gera uma build jogável do Skyrim Together (Windows PE, para rodar sob Proton)
# a partir da branch linux-port, incluindo a correção do CEF para Wine/Proton.
# Dispara manualmente (workflow_dispatch) e a cada push na branch linux-port.
#
# O binário resultante é Windows: o launcher/client é injetado no SkyrimSE.exe e
# roda dentro do prefixo Proton. Não há build ELF nativo do client (ver docs/linux.md).

on:
  workflow_dispatch:
  push:
    branches:
      - linux-port

jobs:
  build-windows:
    uses: ./.github/workflows/windows.yml
    with:
      build-mode: 'release'
      upload-build-for-next-job: true

  package-and-upload:
    runs-on: windows-2022
    needs: build-windows
    steps:
      # Necessário para o README do linux_probe acompanhar o artifact de diagnóstico.
      - uses: actions/checkout@v4

      - name: Download artifact from the previous job
        uses: actions/download-artifact@v4
        with:
          name: internal-job-files

      - name: Package build and organize directories
        shell: bash
        run: |
          mkdir -p str-build/SkyrimTogetherReborn
          mv build/windows/x64/release/* str-build/SkyrimTogetherReborn
          cp -r GameFiles/Skyrim/* str-build/

      # Ferramenta de diagnóstico do port Linux; sai como artifact separado para
      # não poluir a build jogável. Ver Code/linux_probe/README.md.
      - name: Extract linux_probe diagnostic tool
        shell: bash
        run: |
          mkdir -p linux-probe
          # Tolerante a mudanças de layout do build: o probe é diagnóstico e não
          # deve derrubar o job da build jogável se não for encontrado.
          mv str-build/SkyrimTogetherReborn/probe_loader.exe linux-probe/ || echo "probe_loader.exe not found"
          mv str-build/SkyrimTogetherReborn/probe_payload.dll linux-probe/ || echo "probe_payload.dll not found"
          cp Code/linux_probe/README.md linux-probe/
          ls -la linux-probe/

      - name: Remove unnecessary build files, keep .pdb
        shell: bash
        run: |
          mkdir -p str-pdb
          mv str-build/SkyrimTogetherReborn/SkyrimTogether.pdb str-pdb/ || true
          mv str-build/SkyrimTogetherReborn/SkyrimTogetherServer.pdb str-pdb/ || true
          rm -f str-build/SkyrimTogetherReborn/*.pdb
          rm -f str-build/SkyrimTogetherReborn/*.lib
          rm -f str-build/SkyrimTogetherReborn/*.exp
          rm -f str-build/SkyrimTogetherReborn/*Tests.exe

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimTogether-linux-port (${{ needs.build-windows.outputs.str-version }})
          path: str-build/

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Debug Symbols (${{ needs.build-windows.outputs.str-version }})
          path: str-pdb/

      - name: Upload linux_probe diagnostic tool
        uses: actions/upload-artifact@v4
        with:
          name: linux-probe (${{ needs.build-windows.outputs.str-version }})
          path: linux-probe/
