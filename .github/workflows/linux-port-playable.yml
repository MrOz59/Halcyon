name: Linux-port playable build

# Produces a playable Skyrim Together build (Windows PE, run through Proton)
# from the linux-port branch, including the Wine/Proton CEF replacement.
# Runs manually (workflow_dispatch) and after each push to linux-port.
#
# The resulting binary remains a Windows executable: the launcher/client is
# injected into SkyrimSE.exe and runs inside the Proton prefix. There is no native
# ELF client build (see docs/linux.md).

on:
  workflow_dispatch:
  push:
    branches:
      - linux-port

jobs:
  build-windows:
    uses: ./.github/workflows/windows.yml
    with:
      build-mode: 'release'
      upload-build-for-next-job: true

  package-and-upload:
    runs-on: windows-2022
    needs: build-windows
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact from the previous job
        uses: actions/download-artifact@v4
        with:
          name: internal-job-files

      - name: Run unit tests
        shell: pwsh
        run: '& ".\build\windows\x64\release\TPTests.exe"'

      - name: Package build and organize directories
        shell: bash
        run: |
          mkdir -p str-build/SkyrimTogetherReborn
          mv build/windows/x64/release/* str-build/SkyrimTogetherReborn
          cp -r GameFiles/Skyrim/* str-build/

      - name: Remove unnecessary build files, keep .pdb
        shell: bash
        run: |
          mkdir -p str-pdb
          mv str-build/SkyrimTogetherReborn/SkyrimTogether.pdb str-pdb/ || true
          mv str-build/SkyrimTogetherReborn/SkyrimTogetherServer.pdb str-pdb/ || true
          rm -f str-build/SkyrimTogetherReborn/*.pdb
          rm -f str-build/SkyrimTogetherReborn/*.lib
          rm -f str-build/SkyrimTogetherReborn/*.exp
          rm -f str-build/SkyrimTogetherReborn/*Tests.exe

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimTogether-linux-port (${{ needs.build-windows.outputs.str-version }})
          path: str-build/

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Debug Symbols (${{ needs.build-windows.outputs.str-version }})
          path: str-pdb/
